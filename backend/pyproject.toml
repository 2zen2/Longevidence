[project]
name = "longevidence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2", "httpx>=0.27", "tenacity>=8.5", "lxml>=5.2",
  "anthropic>=0.40", "rapidfuzz>=3.9", "python-dotenv>=1.0", "fastembed>=0.4", "numpy>=1.26",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real NCBI/OpenAlex/LLM endpoints (deselected by default)", "db: needs Postgres"]
addopts = "-m 'not live'"
